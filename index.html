<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Treasure Hunt Step 1</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 15vh; background-color: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; width: 90%; }
    .poem { font-style: italic; color: #000000; font-size: 1.15rem; line-height: 1.6; margin-bottom: 70px; }
    .hidden { display: none; }
    input, button { padding: 10px; margin-top: 10px; font-size: 16px; }
    .menu-buttons { display: flex; justify-content: space-between; gap: 35px; margin-top: 40px; }
    .menu-buttons button { flex: 1; padding: 18px 25px; border-radius: 25px; border: none; cursor: pointer; font-size: 18px; }

    .scavenger-button { background-color: #b7e4c7; }
    .trivia-button { background-color: #f4b6b6; }
    .tbh-button { background-color: #f5e6c8; }
  </style>
</head>
<body>

  <div id="lock-screen" class="card">
    <div class="poem">
      In A and B-Wing, search ceiling tiles high,<br>
      Where two QR codes catch your eye.<br>
      Note room numbers closest to each in your view,<br>
      Then multiply both to get your first clue.
    </div>

    <h2>Enter the Secret Code</h2>
    <input type="text" id="code-input" placeholder="Enter calculated number">
    <button onclick="verifyCode()">Submit</button>
    <p id="error-msg" style="color: red;"></p>
  </div>

  <div id="secret-screen" class="card hidden">
    <h2>Access Granted! 🎉</h2>
    <p>Your next destination is the library display case.</p>

    <div class="menu-buttons">
      <button class="scavenger-button">Scavenger Hunt</button>
      <button class="trivia-button">Trivia</button>
      <button class="tbh-button">TBH</button>
    </div>
  </div>

  <script>
    // Replace with your actual target product (e.g., 106 * 206 = 21836)
    const SECRET_CODE = "21836"; 

    function verifyCode() {
      const userEntry = document.getElementById("code-input").value.trim();
      const errorMsg = document.getElementById("error-msg");

      if (userEntry === SECRET_CODE) {
        document.getElementById("lock-screen").classList.add("hidden");
        document.getElementById("secret-screen").classList.remove("hidden");
      } else {
        errorMsg.innerText = "Incorrect code. Check your math and try again!";
      }
    }
  </script>

</body>
</html>
